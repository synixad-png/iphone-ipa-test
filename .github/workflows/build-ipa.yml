name: SHADER LAB 3D - build iPhone IPA and render tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['*.md', 'README.txt']

# Only the newest code should consume the macOS builder or publish an IPA.
concurrency:
  group: shader-lab-ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Check Xcode project and environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          { xcodebuild -version; sw_vers; xcodebuild -showsdks; } | tee dist/build-environment.txt
          plutil -lint HelloIPhone.xcodeproj/project.pbxproj
          xcodebuild -list -project HelloIPhone.xcodeproj
      - name: Build native DOOM engine for physical iOS
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build_doom_ios.sh iphoneos | tee dist/doom-engine-device.log
      - name: Build ARM64 for physical iPhone without signing
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project HelloIPhone.xcodeproj -scheme HelloIPhone \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DeviceBuild" ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build | tee dist/device-build.log
      - name: Package and verify unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/Payload
          ditto "$RUNNER_TEMP/DeviceBuild/Build/Products/Release-iphoneos/HelloIPhone.app" dist/Payload/HelloIPhone.app
          (cd dist && zip -qry SHADER_LAB_3D_v1_unsigned.ipa Payload)
          python3 scripts/verify_ipa.py dist/SHADER_LAB_3D_v1_unsigned.ipa | tee dist/verification.json
          shasum -a 256 dist/SHADER_LAB_3D_v1_unsigned.ipa | tee dist/SHA256SUMS.txt
      - name: Boot an available iPhone simulator
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list devices available -j > "$RUNNER_TEMP/devices.json"
          SIM_UDID=$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print(next(v["udid"] for k,vs in d["devices"].items() if "iOS" in k for v in vs if "iPhone" in v["name"]))' "$RUNNER_TEMP/devices.json")
          echo "SIM_UDID=$SIM_UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$SIM_UDID"
          xcrun simctl bootstatus "$SIM_UDID" -b
      - name: Build native DOOM engine for iOS Simulator
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build_doom_ios.sh iphonesimulator | tee dist/doom-engine-simulator.log
      - name: XCTest - all 35 renders, five modes, PBR controls, unlit and camera
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild test -project HelloIPhone.xcodeproj -scheme HelloIPhone \
            -configuration Debug -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -derivedDataPath "$RUNNER_TEMP/SimulatorBuild" \
            -resultBundlePath "$RUNNER_TEMP/ShaderLabTests.xcresult" \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO | tee dist/simulator-tests.log
          xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/ShaderLabTests.xcresult" > dist/test-summary.json
          DATA_DIR=$(xcrun simctl get_app_container "$SIM_UDID" app.synix.shaderlab3d data)
          ditto "$DATA_DIR/Documents/ShaderLabEvidence" dist/RenderEvidence
          # XCTest may terminate its host app. Reinstall the tested simulator binary before smoke launch.
          SIM_APP="$RUNNER_TEMP/SimulatorBuild/Build/Products/Debug-iphonesimulator/HelloIPhone.app"
          xcrun simctl terminate "$SIM_UDID" app.synix.shaderlab3d || true
          xcrun simctl install "$SIM_UDID" "$SIM_APP"
          if ! xcrun simctl launch "$SIM_UDID" app.synix.shaderlab3d; then
            echo "iPhone simulator launch failed after XCTest - extracting diagnostics:"
            xcrun simctl spawn "$SIM_UDID" log show --last 3m --style compact --predicate 'process == "HelloIPhone" OR eventMessage CONTAINS "app.synix.shaderlab3d"' | tail -150 || true
            exit 1
          fi
          sleep 3
          xcrun simctl io "$SIM_UDID" screenshot dist/App-Simulator.png
      - name: iPad simulator launch smoke test (when available)
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list devices available -j > "$RUNNER_TEMP/ipad-devices.json"
          IPAD_UDID=$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print(next((v["udid"] for k,vs in d["devices"].items() if "iOS" in k for v in vs if "iPad" in v["name"]), ""))' "$RUNNER_TEMP/ipad-devices.json")
          if [[ -z "$IPAD_UDID" ]]; then
            echo "No available iPad simulator. Device launch test NOT performed." | tee dist/iPad-smoke.txt
          else
            xcrun simctl boot "$IPAD_UDID"
            xcrun simctl bootstatus "$IPAD_UDID" -b
            APP="$RUNNER_TEMP/SimulatorBuild/Build/Products/Debug-iphonesimulator/HelloIPhone.app"
            test -d "$APP"
            xcrun simctl install "$IPAD_UDID" "$APP"
            xcrun simctl launch "$IPAD_UDID" app.synix.shaderlab3d
            sleep 3
            xcrun simctl io "$IPAD_UDID" screenshot dist/App-iPad-Simulator.png
            echo "iPad simulator launch PASS; screenshot saved" | tee dist/iPad-smoke.txt
          fi
      - name: Package sources and test evidence
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip --output=dist/SHADER_LAB_3D_v1_ZRODLA.zip HEAD
          # Distribute corresponding GPL engine sources together with the adapter.
          test -f DoomSource/doomgeneric/doomgeneric.c
          zip -qry dist/SHADER_LAB_3D_v1_ZRODLA.zip DoomSource/doomgeneric
          zip -q dist/SHADER_LAB_3D_v1_ZRODLA.zip DoomSource/LICENSE DoomSource/README.md DoomSource/COMMIT_PINNED.txt LICENSE_DOOM_ENGINE.txt
          (cd dist && zip -qry SHADER_LAB_3D_v1_TESTY.zip RenderEvidence App-Simulator.png iPad-smoke.txt test-summary.json simulator-tests.log device-build.log doom-engine-device.log doom-engine-simulator.log build-environment.txt verification.json SHA256SUMS.txt)
          if [[ -f dist/App-iPad-Simulator.png ]]; then (cd dist && zip -q SHADER_LAB_3D_v1_TESTY.zip App-iPad-Simulator.png); fi
      - name: Upload GitHub Actions artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: SHADER_LAB_3D_v1_IPA_SOURCES_TESTS
          path: |
            dist/SHADER_LAB_3D_v1_unsigned.ipa
            dist/SHADER_LAB_3D_v1_ZRODLA.zip
            dist/SHADER_LAB_3D_v1_TESTY.zip
          if-no-files-found: error
          retention-days: 7
      - name: Save verified files in this private repository release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="shader-lab-v1-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          # GitHub Releases sometimes returns temporary 502/404 upload errors.
          # Keep the verified IPA and sources as mandatory outputs; Actions artifact quota is independent.
          for attempt in 1 2 3 4 5; do
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              break
            fi
            if gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
                 --title 'SHADER LAB 3D + ASTEROIDS — iOS IPA' \
                 --notes 'Unsigned ARM64 universal iPhone/iPad application, iOS 16+. Automated XCTest and simulator verification. Sign with Sideloadly. Physical device not tested.'; then
              break
            fi
            if [[ "$attempt" == "5" ]]; then exit 1; fi
            sleep 8
          done
          for attempt in 1 2 3 4 5; do
            if gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
              dist/SHADER_LAB_3D_v1_unsigned.ipa dist/SHADER_LAB_3D_v1_ZRODLA.zip \
              dist/SHADER_LAB_3D_v1_TESTY.zip dist/verification.json dist/SHA256SUMS.txt dist/test-summary.json; then
              break
            fi
            if [[ "$attempt" == "5" ]]; then exit 1; fi
            sleep 8
          done
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets | map(.name) | index("SHADER_LAB_3D_v1_unsigned.ipa")' | grep -Eq '^[0-9]+$'
