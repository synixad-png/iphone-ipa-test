name: Buduj testowy IPA (bez platnego konta Apple)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Pobierz projekt
        uses: actions/checkout@v4
      - name: Wersja Xcode
        run: xcodebuild -version
      - name: Sprawdz projekt i wspoldzielony schemat
        run: |
          plutil -lint HelloIPhone.xcodeproj/project.pbxproj
          xcodebuild -list -project HelloIPhone.xcodeproj
      - name: Kompiluj natywna aplikacje iPhone (bez podpisu)
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project HelloIPhone.xcodeproj \
            -scheme HelloIPhone \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
      - name: Spakuj IPA dla Sideloadly
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/HelloIPhone.app"
          test -d "$APP"
          mkdir -p dist/Payload
          ditto "$APP" dist/Payload/HelloIPhone.app
          cd dist
          /usr/bin/zip -qry HelloIPhone_unsigned.ipa Payload
          /usr/bin/unzip -t HelloIPhone_unsigned.ipa | tail -1
          test -s HelloIPhone_unsigned.ipa
      - name: Zweryfikuj IPA, ARM64 i platforme iOS
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_ipa.py dist/HelloIPhone_unsigned.ipa | tee dist/verification.json
          shasum -a 256 dist/HelloIPhone_unsigned.ipa | tee dist/SHA256SUMS.txt
      - name: Udostepnij IPA do pobrania
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: HelloIPhone_unsigned_IPA
          path: |
            dist/HelloIPhone_unsigned.ipa
            dist/verification.json
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
      - name: Zapisz IPA w prywatnym wydaniu repozytorium
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd dist
          zip -q HelloIPhone_unsigned_IPA.zip HelloIPhone_unsigned.ipa verification.json SHA256SUMS.txt
          gh release create "ipa-build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Testowy IPA — build ${GITHUB_RUN_NUMBER}" \
            --notes "Niepodpisana aplikacja SwiftUI dla fizycznego iPhone, ARM64, iOS 16+. Zweryfikowano strukturę IPA i SHA-256. Instalacja wymaga podpisania, np. przez Sideloadly." \
            HelloIPhone_unsigned.ipa HelloIPhone_unsigned_IPA.zip verification.json SHA256SUMS.txt
